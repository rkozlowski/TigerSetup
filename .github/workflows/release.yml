name: Release TigerSetup
run-name: Release TigerSetup ${{ inputs.version }}

# The one release action (RELEASING.md). Started by hand on main for the
# version the release commit records; it builds that commit's release set once,
# tags the commit and creates the draft GitHub Release carrying the set. It
# publishes nothing. Every decision is an eng/release script a maintainer can
# run locally; this file only orders them and moves the set between jobs.
#
# The version reaches the scripts through RELEASE_VERSION, never through
# expression interpolation into a shell. Its default is the release commit's
# version, so the form opens prefilled with it; the prerequisites gate refuses a
# commit whose default and Cargo.toml disagree.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The <Major>.<Minor>.<Patch> version the release commit records in Cargo.toml
        required: true
        default: '0.14.1'
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  # tiger-mark, the build tool that renders the installed help's PDF, is built
  # from this TigerMarkView commit - the full SHA, never a branch or tag - which
  # must contain TigerMarkView's active-content security fix. No TigerMarkView
  # release or installer is used.
  TIGERMARKVIEW_COMMIT: 'cd94b4ac5e7b5fa034fbf569b785575bda2bab7d'

concurrency:
  group: release-tigersetup-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Only what the authoritative build needs to start safely. The verification
  # gate ran in the closed loop before the push and is not repeated here.
  prerequisites:
    name: Version, notes, commit on main, tag free
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove the commit may be released as this version
        shell: pwsh
        run: ./eng/release/Assert-ReleaseCommitReady.ps1 -Version $env:RELEASE_VERSION -CommitSha $env:GITHUB_SHA

  build:
    name: Build the release set from the commit
    needs: prerequisites
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      record_sha256: ${{ steps.build.outputs.record_sha256 }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET 10 for tiger-mark
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build tiger-mark from the pinned TigerMarkView commit
        id: tigermark
        shell: pwsh
        run: >-
          ./eng/release/Build-TigerMark.ps1
          -Commit $env:TIGERMARKVIEW_COMMIT
          -Directory "$env:RUNNER_TEMP\tigermarkview"
          -GitHubOutput $env:GITHUB_OUTPUT

      - name: Build, check and record the release set
        id: build
        shell: pwsh
        env:
          TIGER_MARK: ${{ steps.tigermark.outputs.path }}
        run: >-
          ./eng/release/Build-ReleaseArtifacts.ps1
          -Version $env:RELEASE_VERSION
          -CommitSha $env:GITHUB_SHA
          -OutputDirectory artifacts/release
          -TigerMarkPath $env:TIGER_MARK
          -GitHubOutput $env:GITHUB_OUTPUT

      - name: The build changed no committed file
        run: git diff --exit-code

      - name: Hand the set to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: TigerSetup-release-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Tag the commit and create the draft release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Receive the set
        uses: actions/download-artifact@v7
        with:
          name: TigerSetup-release-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/release

      - name: Tag the commit and create the draft release with the exact set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_SHA256: ${{ needs.build.outputs.record_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          ./eng/release/Publish-DraftRelease.ps1
          -Version $env:RELEASE_VERSION
          -ArtifactDirectory artifacts/release
          -CommitSha $env:GITHUB_SHA
          -ExpectedRecordSha256 $env:RECORD_SHA256
          -RunUrl $env:RUN_URL
