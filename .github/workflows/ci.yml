name: Elevated runner tests

# A diagnostic started by hand, never by a push, and no release prerequisite.
# It closes the one uncertainty the closed loop cannot: the workspace tests
# under a hosted runner's elevated administrator token. A developer shell is
# unelevated, and running the suite elevated on the Architect's desktop is not
# a reasonable substitute. Start it when a change touches a token-dependent path
# (LESSONS_LEARNED.md, the hosted-runner lesson). Everything else - format,
# clippy, the release build, the lab-script and release-tooling tests - gives
# the same evidence locally and runs there, in the verification gate
# (AGENTS.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Workspace tests, elevated
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Toolchain
        run: rustc --version; cargo --version

      # Every test binary runs even after one fails, so a failing run reports
      # all it can; the step still fails on any failure.
      - name: Test
        run: cargo test --workspace --no-fail-fast
