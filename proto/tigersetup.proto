// TigerSetup runtime metadata: the build-time-resolved form of TigerSetup.toml
// that a generated installer carries in its metadata block. The engine plans
// from this message tree and from nothing else.
//
// Versioning follows Protocol Buffers' own rules: field numbers are never
// reused, unknown fields are ignored, and `schema` names the major version an
// engine must understand. An engine refuses a metadata major it does not know.
// Schema 2 added `file_batches`, which an engine needs to plan; a schema-1
// message tree, which no published installer carries, is refused.
//
// Templates: string fields marked "template" carry `%NAME%` placeholders the
// engine expands on the target machine — the known folders `%LOCALAPPDATA%`,
// `%PROGRAMDATA%`, `%PROGRAMFILES%`, `%PROGRAMFILESX86%`, `%DESKTOP%`,
// `%PROGRAMS%`, `%COMMONDESKTOP%`, `%COMMONPROGRAMS%`, `%STARTUP%`,
// `%COMMONSTARTUP%`, `%SENDTO%`, plus `%INSTALLROOT%` and `%VERSION%` where a
// field says so.
//
// Predicates: a resource that carries a `when` exists in the desired state
// only while the named option has the named value. `equals` is the canonical
// text of an option value: "true" or "false" for a boolean option, a declared
// choice value for a choice option. There is deliberately nothing more — no
// expressions, no negation, no combination: a resource wanted under two values
// is declared twice.

syntax = "proto3";

package tigersetup.metadata.v1;

message Metadata {
  // Major version of this message tree. Currently 2.
  uint32 schema = 1;
  Package package = 2;
  Install install = 3;
  // Files in install order. Paths are install-relative, forward-slash
  // separated, without a leading separator.
  repeated File files = 4;
  // Directories the files need, parents before children, install-relative.
  repeated Directory directories = 5;
  Engine engine = 6;
  // What this executable is: the installer, or the uninstaller copy the
  // engine writes into the state directory (same metadata, no payload).
  Role role = 7;
  // For an uninstaller copy: the scope whose installation it serves.
  Scope uninstaller_scope = 8;
  // Declared installer options, in declaration order.
  repeated InstallOption options = 9;
  repeated Shortcut shortcuts = 10;
  repeated PathEntry path_entries = 11;
  repeated RegistryValue registry_values = 12;
  Registration registration = 13;
  // Absent when the package migrates from nothing.
  Legacy legacy = 14;
  repeated Dependency dependencies = 15;
  repeated EnvironmentVariable environment_variables = 16;
  repeated FileAssociation file_associations = 17;
  repeated UrlProtocol url_protocols = 18;
  repeated AppPath app_paths = 19;
  repeated ContextMenuVerb context_menu_verbs = 20;
  repeated FirewallRule firewall_rules = 21;
  // Custom lifecycle actions, in declaration order.
  repeated Action actions = 22;
  // The index of the payload stream: every entry the payload carries, in
  // stream order (TigerSetup-Design.md §10.4). A `File`, an embedded
  // dependency and a packaged action name their bytes by `entry`, and this
  // list says where in the uncompressed stream those bytes are. The order
  // is data: an engine reads the stream once, in this order, and never
  // reproduces the builder's sorting rule.
  repeated PayloadEntry payload = 23;
  // Application quiescence, in declaration order (TigerSetup-Design.md
  // §5.10): how to stop a running application that the Restart Manager
  // cannot close, before the Restart Manager is asked, and how to start it
  // again afterwards.
  repeated Quiescence quiescence = 24;
  // The file batches: consecutive runs of `files`, in order, that partition
  // the list exactly (TigerSetup-Design.md §10.4). A batch is the unit the
  // engine journals and recovers file operations by, and the builder is
  // what decides it, from the payload order and every file's size: a batch
  // closes before the file that would take it past 256 files or past
  // 32 MiB, and a file larger than that alone is a batch of its own. An
  // engine reads the boundaries; it never reproduces the rule.
  repeated FileBatch file_batches = 25;
}

// One batch of consecutive files.
message FileBatch {
  // The index into `files` of the batch's first file.
  uint32 first_file = 1;
  // How many consecutive files the batch holds; never zero.
  uint32 file_count = 2;
  // The sum of those files' sizes.
  uint64 bytes = 3;
}

// How a package makes one running application ready for the files it holds
// to be replaced or removed, where the Windows Restart Manager cannot: a
// program that stops it, run before the Restart Manager is asked, and a
// program that starts it again once the run has ended with the product
// installed. TigerSetup records what the stop program found — running and
// now stopped, or not running — and starts only what it stopped: after a
// successful install, upgrade, reinstall or repair, and after a run that
// failed or rolled back at any point past the stop, so that a refusal —
// another holder the Restart Manager could not close — never leaves the
// application stopped for nothing. An uninstall stops and never resumes;
// a rolled-back uninstall resumes.
message Quiescence {
  // Stable identity, unique among the package's quiescence entries and its
  // actions: what every log line, finding and report names it by.
  string name = 1;
  // The operations the entry runs on; empty means upgrade, reinstall,
  // repair and uninstall — the operations that find an installation whose
  // application may be running. INSTALL may be named for a package whose
  // stop program does not need the product's files.
  repeated ActionOperation run_on = 2;
  // The program that stops the application, with the custom action's
  // envelope (kind, program or packaged file, arguments, working
  // directory, timeout): its `success_codes` mean the application was
  // running and is now stopped; `not_running_codes` mean nothing was
  // running; any other exit code, a timeout or a launch failure is a
  // failed quiescence, which `on_failure` decides — FAIL stops the run
  // before anything is mutated, CONTINUE records the failure and lets the
  // Restart Manager have its turn. Its `phase` is QUIESCE.
  Action stop = 3;
  // The program that starts the application again, started detached —
  // not waited for, not bounded, not captured — with the run's token and
  // shown as it starts. Absent means the application is not restarted.
  // Its `phase` is RESUME.
  Action resume = 4;
  // Exit codes of `stop` that mean the application was not running, so
  // there is nothing to resume.
  repeated int32 not_running_codes = 5;
  Predicate when = 6;
}

// One region of the uncompressed payload stream.
message PayloadEntry {
  // The entry name: an install-relative file path, or a reserved
  // `.tigersetup/...` name.
  string entry = 1;
  // Where the region starts in the uncompressed stream, and how long it is.
  uint64 offset = 2;
  uint64 length = 3;
  // CRC-32 (IEEE) of the region's bytes: what an engine checks as it reads
  // the region, so that a wrong offset or length in this index can never
  // install the wrong bytes.
  fixed32 crc32 = 4;
  // Lower-case hex SHA-256 of the region's bytes: the identity an installed
  // file is owned by, known before the stream is decoded, so that an
  // upgrade or a repair compares what the machine holds with what the
  // package brings without reading either.
  string sha256 = 5;
}

// The one predicate an optional resource may carry (see the header comment).
message Predicate {
  // Lower-case declared option name.
  string option = 1;
  // Canonical option value text the option must have.
  string equals = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_INSTALLER = 1;
  ROLE_UNINSTALLER = 2;
}

message Package {
  // Stable product identity, e.g. "ItTiger.TigerMarkView". Also the default
  // Add/Remove Programs key name and the WinGet package identifier.
  string id = 1;
  // Product name; also the default install folder name.
  string name = 2;
  // Package version, "major.minor.patch".
  string version = 3;
  string publisher = 4;
  string description = 5;
  string copyright = 6;
  // Licence identity (an SPDX identifier where one applies).
  string license = 7;
  // The licence text the wizard shows; empty means no licence page.
  string license_text = 8;
  string website_url = 9;
  string support_url = 10;
  string help_url = 11;
  // Bytes of an .ico the wizard shows for the product; empty means the
  // engine's own icon.
  bytes icon = 12;
  // Four-part Windows file version of the main executable, when known.
  string file_version = 13;
}

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_USER = 1;
  SCOPE_MACHINE = 2;
}

message Install {
  // Supported scopes; the first entry is the default.
  repeated Scope scopes = 1;
  // Install root templates per scope.
  string user_root = 2;
  string machine_root = 3;
  // Lowest Windows build the package supports; 0 means the engine's own
  // baseline (17763).
  uint32 minimum_build = 4;
  // "x64" for now.
  string architecture = 5;
  // Total size of the file set, for Add/Remove Programs.
  uint64 estimated_size = 6;
  // What a run does when the product is already installed in a scope other
  // than the one it would use; unspecified means PRESERVE.
  ExistingScopePolicy existing_scope = 7;
}

// The policy for an installation found in the other scope. A run whose
// client named no scope always continues with a single existing
// installation, whichever scope it is in, except under ERROR; a run whose
// client named a scope that has no installation while the other scope has
// one is refused with `scope_conflict` unless the policy allows a second,
// parallel installation. Two existing installations are never chosen
// between by the engine: the client names one or is refused with
// `scope_ambiguous`.
enum ExistingScopePolicy {
  EXISTING_SCOPE_POLICY_UNSPECIFIED = 0;
  // Continue with the existing installation; refuse an explicit request
  // for the other scope. The default.
  EXISTING_SCOPE_POLICY_PRESERVE = 1;
  // An explicit request for the other scope creates a second, independent
  // installation.
  EXISTING_SCOPE_POLICY_ALLOW_PARALLEL = 2;
  // Refuse every run whose scope, named or defaulted, is not the one the
  // product is installed in.
  EXISTING_SCOPE_POLICY_ERROR = 3;
}

message File {
  string path = 1;
  uint64 size = 2;
  // Name of the payload entry holding the file's bytes (`PayloadEntry`).
  string entry = 3;
  // Absent means always installed. A directory is desired while any file
  // below it is, so a directory needs no predicate of its own.
  Predicate when = 4;
}

message Directory {
  string path = 1;
}

message Engine {
  // Version of the TigerSetup that built the installer.
  string tigersetup_version = 1;
  // Hex SHA-256 of the TigerSetup engine executable the installer was built
  // from: the release tigersetup-setup.exe, which is one file for every
  // package. What `tiger-setup build` prints as the engine hash, and what a
  // lab compares with the engine beside the builder.
  string engine_sha256 = 2;
  // Hex SHA-256 of the engine executable as the loader runs it: the engine
  // after the builder gave its copy the product's version resource and
  // icons, before compression. The footer records the same hash, and the
  // loader refuses to start an engine whose bytes do not match it.
  string engine_block_sha256 = 3;
  // Hex SHA-256 of the TigerSetup loader executable the installer was built
  // from: the release tigersetup-loader.exe, one file for every package.
  string loader_sha256 = 4;
  // Hex SHA-256 of the loader block as composed -- bytes [0, engine offset)
  // of the file, which is the loader after the builder gave its copy the
  // product's version resource and icons.
  string loader_block_sha256 = 5;
}

enum OptionKind {
  OPTION_KIND_UNSPECIFIED = 0;
  // Labelled by the package through `labels`.
  OPTION_KIND_CUSTOM = 1;
  // "Add <product> to PATH": the wizard labels it in its own language.
  OPTION_KIND_PATH = 2;
  // "Create a desktop shortcut": labelled by the wizard.
  OPTION_KIND_DESKTOP_SHORTCUT = 3;
  // One value chosen from `choices`, labelled by the package through
  // `labels` (the heading) and each choice's own labels.
  OPTION_KIND_CHOICE = 4;
}

// One value of a choice option.
message OptionChoice {
  // Lower-case value, unique within the option, as the command line and the
  // state database spell it.
  string value = 1;
  // Wizard label per locale; the wizard falls back to `en-US`, then to the
  // value.
  map<string, string> labels = 2;
}

// A declared installer option, settable from the command line
// (`--option <name> <value>`) or the wizard, and remembered by the
// installation so an upgrade keeps the user's choice. Every kind but CHOICE
// is a boolean whose canonical values are "true" and "false"; a CHOICE
// option's canonical value is one of its declared choice values.
message InstallOption {
  string name = 1;
  // The default of a boolean option.
  bool default = 2;
  OptionKind kind = 3;
  // Wizard label per locale (BCP 47 tag → text) for a custom or choice
  // option; the wizard falls back to `en-US`, then to the name.
  map<string, string> labels = 4;
  // The values of a CHOICE option, in declaration order.
  repeated OptionChoice choices = 5;
  // The default of a CHOICE option: one of `choices`.
  string default_choice = 6;
}

enum ShortcutLocation {
  SHORTCUT_LOCATION_UNSPECIFIED = 0;
  // The Start Menu Programs folder of the scope.
  SHORTCUT_LOCATION_START_MENU = 1;
  // The desktop of the scope.
  SHORTCUT_LOCATION_DESKTOP = 2;
  // The Startup folder of the scope: the link's target runs at sign-in.
  SHORTCUT_LOCATION_STARTUP = 3;
  // The signed-in user's Send To folder. There is no machine-wide one, so
  // a machine-scope run reports `shortcut_location_unavailable` and creates
  // nothing.
  SHORTCUT_LOCATION_SEND_TO = 4;
}

message Shortcut {
  ShortcutLocation location = 1;
  // Link name without ".lnk" (or ".url" for a URL shortcut).
  string name = 2;
  // Install-relative path of the target; empty for a URL shortcut.
  string target = 3;
  string arguments = 4;
  string description = 5;
  // Install-relative path of the icon source; empty means the target.
  string icon = 6;
  // Name of the option that enables this shortcut; empty means always. The
  // spelling metadata written before `when` existed uses; it means
  // `when = { option, equals = "true" }`.
  string option = 7;
  // Subfolder under the location; empty places the link directly in it.
  string folder = 8;
  Predicate when = 9;
  // Install-relative working directory; empty means the target's directory.
  string working_directory = 10;
  // The AppUserModelID Windows groups the target's windows and taskbar
  // entries under; empty writes none.
  string app_user_model_id = 11;
  // A URL the shortcut opens instead of an installed file: the link is then
  // an Internet shortcut (".url") and `target`, `arguments`,
  // `working_directory` and `app_user_model_id` are empty.
  string url = 12;
}

message PathEntry {
  // Install-relative directory; empty means the install root.
  string path = 1;
  // Name of the option that enables this entry; empty means always (the
  // older spelling of `when = { option, equals = "true" }`).
  string option = 2;
  Predicate when = 3;
}

enum RegistryKind {
  REGISTRY_KIND_UNSPECIFIED = 0;
  REGISTRY_KIND_STRING = 1;
  REGISTRY_KIND_EXPAND_STRING = 2;
  REGISTRY_KIND_DWORD = 3;
}

// Where a registry value's key path starts.
enum RegistryRoot {
  // The scope's software root: `HKCU\Software` for user scope,
  // `HKLM\Software` for machine scope. Every value written before `root`
  // existed has this root.
  REGISTRY_ROOT_SOFTWARE = 0;
  // An explicit hive root, for a value outside `Software`: the key path is
  // then the full path below the hive (`SYSTEM\CurrentControlSet\...`).
  // The hive must be the one the installation's scope writes, so `HKLM`
  // belongs to a machine-only package and `HKCU` to a user-only one.
  REGISTRY_ROOT_LOCAL_MACHINE = 1;
  REGISTRY_ROOT_CURRENT_USER = 2;
}

// A product registry value: under the scope's software root by default, or
// at an explicit location in the scope's hive.
message RegistryValue {
  // Key path relative to `root`, e.g. "IT Tiger\\TigerMarkView" under the
  // software root or "SYSTEM\\CurrentControlSet\\Control\\FileSystem" under
  // an explicit hive root.
  string key = 1;
  string name = 2;
  RegistryKind kind = 3;
  // Template: %INSTALLROOT% and %VERSION% are expanded.
  string data = 4;
  Predicate when = 5;
  RegistryRoot root = 6;
}

// Add/Remove Programs registration. Everything not declared here derives
// from the package (publisher, version, install location, uninstall
// strings, estimated size, URLs).
message Registration {
  // Uninstall key name; empty means the package id.
  string key_name = 1;
  // Empty means the package name.
  string display_name = 2;
  // Empty means the package version.
  string display_version = 3;
  // Install-relative path of the icon source; empty means no DisplayIcon.
  string display_icon = 4;
}

// The footprint of the installer technology the product migrates from
// (TigerSetup-Design.md §5.12). Migration is uninstall-first.
message Legacy {
  // "inno" is the first supported type.
  string installer_type = 1;
  // The Add/Remove Programs key the legacy installer wrote.
  string registration_key = 2;
}

enum DetectorKind {
  DETECTOR_KIND_UNSPECIFIED = 0;
  // `path` names a directory whose child directories are versions; the
  // highest matching `pattern` satisfies the requirement when it meets the
  // minimum.
  DETECTOR_KIND_DIRECTORY_VERSION = 1;
  // `keys` (full paths with hive) are tried in order; `value` is read as a
  // version string. Empty and "0.0.0.0" mean absent.
  DETECTOR_KIND_REGISTRY_VERSION = 2;
  // `path` names an executable or DLL; its Windows file version is read.
  DETECTOR_KIND_FILE_VERSION = 3;
  // An Add/Remove Programs entry whose DisplayName matches `pattern` (a
  // regular expression) in either hive; DisplayVersion is the version.
  DETECTOR_KIND_REGISTRATION = 4;
}

message Detector {
  DetectorKind kind = 1;
  // Template; environment variables such as %DOTNET_ROOT% also expand.
  string path = 2;
  repeated string keys = 3;
  string value = 4;
  string pattern = 5;
}

enum AcquisitionSource {
  ACQUISITION_SOURCE_UNSPECIFIED = 0;
  // The WinGet community catalog: the hint was resolved from it at build
  // time and the engine refreshes from it at install time.
  ACQUISITION_SOURCE_WINGET = 1;
  // A fixed URL with a fixed hash; never refreshed.
  ACQUISITION_SOURCE_URL = 2;
  // The installer's bytes travel inside this installer's payload, as the
  // payload entry `entry`, whose SHA-256 is `sha256`. Nothing is downloaded.
  ACQUISITION_SOURCE_EMBEDDED = 3;
}

// Where an installer for a missing dependency comes from. For the WinGet
// source the URL, version and hash are a build-time hint that the engine
// refreshes when stale (TigerSetup-Design.md §7.9); for the URL source they
// are the requirement itself.
message Acquisition {
  AcquisitionSource source = 1;
  // WinGet package identifier.
  string package_identifier = 2;
  // Version the hint resolved to.
  string version = 3;
  string url = 4;
  // Lower-case hex SHA-256 of the file at `url`.
  string sha256 = 5;
  string architecture = 6;
  // Unix seconds when the hint was resolved; 0 when unknown.
  int64 resolved_at = 7;
  // Hint lifetime in days for the WinGet source; 0 means never refresh.
  uint32 max_age_days = 8;
  // The WinGet installer entry's scope ("machine", "user" or empty).
  string scope = 9;
  // The WinGet installer type the switches were resolved for; for an
  // embedded installer, "msi" or "exe" from the file's extension.
  string installer_type = 10;
  // EMBEDDED: the payload entry carrying the installer, and its size.
  string entry = 11;
  uint64 size = 12;
}

// How the acquired file is run unattended.
message DependencyInstall {
  repeated string arguments = 1;
  // Exit codes that mean success besides 0.
  repeated int32 success_codes = 2;
  // Exit codes that mean success with a reboot pending.
  repeated int32 reboot_codes = 3;
  // The package author wrote these switches and codes, so a catalog refresh
  // keeps them; otherwise they were resolved from the catalog at build time
  // and a refresh replaces them with the current manifest's.
  bool declared = 4;
}

message Dependency {
  // Requirement identity; the WinGet package identifier for catalog-backed
  // dependencies.
  string id = 1;
  string display_name = 2;
  // Lowest acceptable version; a satisfying version has the same major
  // component and is not lower. Empty means any version.
  string minimum_version = 3;
  Detector detect = 4;
  Acquisition acquisition = 5;
  DependencyInstall install = 6;
  // The dependency's installer needs an elevated process.
  bool elevation_required = 7;
  // Absent means the dependency is always required.
  Predicate when = 8;
}

// A variable of the scope's environment (`HKCU\Environment` or the
// machine's `Session Manager\Environment`), separate from the PATH list.
// TigerSetup records the value it wrote and the value that was there before,
// restores the previous value when the variable is removed, and preserves a
// value something else changed afterwards.
message EnvironmentVariable {
  string name = 1;
  // Template: %INSTALLROOT% and %VERSION% are expanded.
  string value = 2;
  // Written as REG_EXPAND_SZ when true, REG_SZ otherwise.
  bool expandable = 3;
  Predicate when = 4;
}

// Registers the product as a handler for file extensions without making it
// the default: a ProgID under the scope's `Software\Classes`, an
// `OpenWithProgids` entry per extension, and a capability registration
// Windows Settings lists the application under.
message FileAssociation {
  // The ProgID, e.g. "TigerMarkView.Document".
  string prog_id = 1;
  // Extensions with their leading dot.
  repeated string extensions = 2;
  // The type description shown by Explorer.
  string description = 3;
  // Install-relative icon source; empty means the executable.
  string icon = 4;
  // Install-relative executable.
  string executable = 5;
  // Command arguments; empty means "%1".
  string arguments = 6;
  Predicate when = 7;
}

// Registers a URL scheme handler the same way: a ProgID with `URL Protocol`,
// the scheme's own class key when nothing else owns it, and a capability
// registration.
message UrlProtocol {
  // The scheme without the colon, e.g. "tigermarkview".
  string scheme = 1;
  // ProgID of the handler class; empty means "<product name>.<scheme>".
  string prog_id = 2;
  string description = 3;
  string icon = 4;
  string executable = 5;
  // Command arguments; empty means "%1".
  string arguments = 6;
  Predicate when = 7;
}

// An `App Paths` registration, so `Run`, `ShellExecute` and `start` find an
// installed executable by name.
message AppPath {
  // Install-relative executable; its file name is the key.
  string executable = 1;
  // Whether the executable's directory is also written as the `Path` value.
  bool add_directory = 2;
  Predicate when = 3;
}

enum ContextMenuTarget {
  CONTEXT_MENU_TARGET_UNSPECIFIED = 0;
  // Every file (`*`), or the files of `extensions` when given.
  CONTEXT_MENU_TARGET_FILES = 1;
  // Directories.
  CONTEXT_MENU_TARGET_DIRECTORIES = 2;
  // The background of an open directory.
  CONTEXT_MENU_TARGET_DIRECTORY_BACKGROUND = 3;
}

// A classic (registry-declared) Explorer context-menu verb.
message ContextMenuVerb {
  ContextMenuTarget target = 1;
  // The verb key name, e.g. "open-with-tigermarkview".
  string verb = 2;
  // The menu text.
  string label = 3;
  string executable = 4;
  // Command arguments; empty means "%1" for files and directories and "%V"
  // for a directory background.
  string arguments = 5;
  // Install-relative icon source; empty writes none.
  string icon = 6;
  // FILES only: limit the verb to these extensions (with their dots).
  repeated string extensions = 7;
  Predicate when = 8;
}

enum FirewallDirection {
  FIREWALL_DIRECTION_UNSPECIFIED = 0;
  FIREWALL_DIRECTION_IN = 1;
  FIREWALL_DIRECTION_OUT = 2;
}

enum FirewallAction {
  FIREWALL_ACTION_UNSPECIFIED = 0;
  FIREWALL_ACTION_ALLOW = 1;
  FIREWALL_ACTION_BLOCK = 2;
}

enum FirewallProtocol {
  // Any protocol.
  FIREWALL_PROTOCOL_UNSPECIFIED = 0;
  FIREWALL_PROTOCOL_TCP = 1;
  FIREWALL_PROTOCOL_UDP = 2;
}

// A Windows Firewall rule for an installed program. Rules are machine-wide
// and need an administrator; a run without one reports
// `firewall_rule_skipped_unelevated` and creates nothing.
message FirewallRule {
  // The rule's display name; TigerSetup also groups the rule under the
  // product so that its own rules are told from a stranger's with the same
  // name.
  string name = 1;
  string description = 2;
  // Install-relative executable.
  string program = 3;
  FirewallDirection direction = 4;
  FirewallAction action = 5;
  FirewallProtocol protocol = 6;
  // Local ports, "80" or "8000-8010" or "80,443"; empty means any. Needs a
  // protocol.
  string local_ports = 7;
  Predicate when = 8;
}

// Where in a run a custom action executes (TigerSetup-Design.md §5.14).
enum ActionPhase {
  ACTION_PHASE_UNSPECIFIED = 0;
  // After the dependencies are satisfied, before any product resource is
  // mutated: the first operations of an installing transaction.
  ACTION_PHASE_PRE_INSTALL = 1;
  // After every product resource is applied, before the commit: the last
  // operations of an installing transaction.
  ACTION_PHASE_POST_INSTALL = 2;
  // Before any owned resource is removed: the first operations of an
  // uninstall transaction.
  ACTION_PHASE_PRE_UNINSTALL = 3;
  // After every owned resource is removed, before the commit: the last
  // operations of an uninstall transaction. The install root is gone.
  ACTION_PHASE_POST_UNINSTALL = 4;
  // The stop program of a `Quiescence` entry: before the Restart Manager is
  // asked, before the transaction. Never a standalone action.
  ACTION_PHASE_QUIESCE = 5;
  // The resume program of a `Quiescence` entry: after the run, detached.
  // Never a standalone action.
  ACTION_PHASE_RESUME = 6;
}

// How an action's program is started.
enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  // A native executable, run directly.
  ACTION_KIND_EXE = 1;
  // A script run by Windows PowerShell:
  // `powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File <script> <arguments>`.
  ACTION_KIND_POWERSHELL = 2;
  // A batch script run by the command interpreter:
  // `cmd.exe /d /s /c "<script> <arguments>"`.
  ACTION_KIND_CMD = 3;
}

// The lifecycle operations an action may run on. An installing transaction
// is one of the first four; an uninstall is the fifth.
enum ActionOperation {
  ACTION_OPERATION_UNSPECIFIED = 0;
  ACTION_OPERATION_INSTALL = 1;
  ACTION_OPERATION_UPGRADE = 2;
  ACTION_OPERATION_REINSTALL = 3;
  ACTION_OPERATION_REPAIR = 4;
  ACTION_OPERATION_UNINSTALL = 5;
}

enum ActionFailurePolicy {
  // Means FAIL.
  ACTION_FAILURE_POLICY_UNSPECIFIED = 0;
  // A failed action fails the transaction, which rolls back what
  // TigerSetup owns.
  ACTION_FAILURE_POLICY_FAIL = 1;
  // A failed action is recorded and reported, and the transaction goes on.
  ACTION_FAILURE_POLICY_CONTINUE = 2;
}

// A custom lifecycle action: a program TigerSetup starts at a phase of a
// run, under a controlled envelope, and records. TigerSetup owns the
// execution and its evidence; whatever the program changes on the machine
// is the package author's responsibility and is never rolled back.
message Action {
  // Stable identity, unique within the package (an option-name-shaped
  // word): what every log line, finding and report names the action by.
  string name = 1;
  ActionPhase phase = 2;
  // The operations the action runs on; never empty, and never an operation
  // the phase does not belong to.
  repeated ActionOperation run_on = 3;
  ActionKind kind = 4;
  // Template: the program (EXE) or script (POWERSHELL, CMD) on the target
  // machine. Empty when the program travels in the package (`entry`).
  string command = 5;
  // A packaged program or script: the payload entry holding its bytes
  // (`.tigersetup/actions/<file name>`), its file name, exact size and
  // lower-case hex SHA-256. Empty `entry` means `command` names it.
  string entry = 6;
  string file_name = 7;
  uint64 size = 8;
  string sha256 = 9;
  // Templates, passed as separate arguments; never joined by a shell.
  repeated string arguments = 10;
  // Template; empty means the directory of the resolved program or script.
  string working_directory = 11;
  // The process is killed and the action has failed once this many seconds
  // pass; 0 means the engine's default.
  uint32 timeout_seconds = 12;
  // Exit codes that mean success; empty means 0 alone.
  repeated int32 success_codes = 13;
  // Exit codes that mean success with a reboot pending.
  repeated int32 reboot_codes = 14;
  ActionFailurePolicy on_failure = 15;
  Predicate when = 16;
}
