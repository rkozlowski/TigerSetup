# TigerSetup packages itself: the self-hosted installer of the three release
# binaries (`tiger-setup.exe`, the builder; `tigersetup-setup.exe`, the
# engine; `tigersetup-loader.exe`, the loader every generated Setup.exe
# begins with), its licence and third-party notices, and the installed help,
# built by the current TigerSetup release
# on the normal release-quality path (`TigerSetup-Design.md` §8.4).
# Build-Package.ps1 stages the release binaries, LICENSE.txt,
# THIRD-PARTY-NOTICES.md and the help — the Markdown
# from docs/TigerSetup-Help.md and the PDF rendered from it — into stage/ and
# runs `tiger-setup build` on this file; stage/ is ignored by Git.
#
# The product being installed is TigerSetup, so the generated Setup.exe's own
# Windows VERSIONINFO and icon identify TigerSetup — which is exactly what a
# generated installer is meant to do for any product.

[package]
id = "ItTiger.TigerSetup"              # stable identity: ARP key, WinGet id
name = "TigerSetup"
publisher = "IT Tiger"
license = "MIT"
license_file = "../../LICENSE.txt"     # shown by the wizard's licence page
icon = "../../docs/assets/TigerSetup.ico"   # the product's branding icon
description = "Command-line tool that builds small, self-contained Windows installers (Setup.exe) from a TigerSetup.toml."
website = "https://www.ittiger.net/"
# support and help are omitted: the publisher's site above is the one
# destination the product metadata names (TigerSetup-Design.md §8.4).

[metadata]
source = "exe"                         # version, copyright and company from the packaged builder's VERSIONINFO
executable = "stage/tiger-setup.exe"

[install]
scopes = ["user", "machine"]           # per-user by default (no elevation for a developer tool), machine-wide on request
architecture = "x64"
# existing_scope defaults to preserve: a rerun updates the installation that
# is there rather than adding a second one in the other scope.

[[files]]
source = "stage/**"                    # the three release binaries, the licence, the notices and help\ (Build-Package.ps1)

# The Start Menu folder is how a person finds a command-line tool again:
# Start > TigerSetup > TigerSetup Shell opens a command prompt that runs this
# installation's tiger-setup, with or without the PATH option.
[[shortcuts]]
location = "start-menu"
folder = "TigerSetup"
name = "TigerSetup Shell"
target = "tiger-setup.exe"
arguments = "shell"
description = "A command prompt with tiger-setup ready to use"

# The help shortcuts carry no icon of their own: each shows its document's
# file-type icon, so only the shell wears TigerSetup's. The PDF is the help a
# clean Windows opens directly; the Markdown source is the second form.
[[shortcuts]]
location = "start-menu"
folder = "TigerSetup"
name = "TigerSetup Help"
target = "help/TigerSetup-Help.pdf"
description = "Getting started with TigerSetup"

[[shortcuts]]
location = "start-menu"
folder = "TigerSetup"
name = "TigerSetup Help (Markdown)"
target = "help/TigerSetup-Help.md"
description = "Getting started with TigerSetup, as Markdown"

[[options]]
name = "path"
kind = "path"
default = true                         # the point of installing a command-line tool

[[path]]
entry = "."                            # the install root holds tiger-setup.exe, tigersetup-setup.exe and tigersetup-loader.exe
option = "path"

[registration]
display_icon = "tiger-setup.exe"

[winget]
moniker = "tigersetup"
commands = ["tiger-setup"]
tags = ["installer", "setup", "packaging", "cli", "installer-builder"]
publisher_url = "https://www.ittiger.net/"
# The WinGet locale manifest names TigerSetup's own first-party pages: the
# repository the release comes from, its issues, the release's notes, and the
# licence and privacy statement frozen with the release - the LICENSE.txt and
# PRIVACY.md assets of its GitHub Release (RELEASING.md), never a page that
# changes later ({version} is the package version).
package_url = "https://github.com/rkozlowski/TigerSetup"
publisher_support_url = "https://github.com/rkozlowski/TigerSetup/issues"
license_url = "https://github.com/rkozlowski/TigerSetup/releases/download/v{version}/LICENSE.txt"
release_notes_url = "https://github.com/rkozlowski/TigerSetup/releases/tag/v{version}"
privacy_url = "https://github.com/rkozlowski/TigerSetup/releases/download/v{version}/PRIVACY.md"
short_description = "Command-line tool that builds small, self-contained Windows installers (Setup.exe)."
# The same story as README.md and the installed help, in the order a person
# needs it: what it is, how to start it, the first commands, what the
# installer does to the machine, and what makes the installers it builds
# different.
description = """
TigerSetup is a command-line tool that builds Windows installers. Describe your
application in a TigerSetup.toml file, and tiger-setup build produces one
self-contained Setup.exe with a wizard, a quiet mode for automation, upgrade,
repair and uninstall, and no runtime prerequisites on the target machine.

After installing, open Start > TigerSetup > TigerSetup Shell: a command prompt
with tiger-setup ready to use, which opens on a short getting-started summary.
Start > TigerSetup > TigerSetup Help opens the getting-started guide (PDF).

First commands: tiger-setup build TigerSetup.toml, then tiger-setup inspect and
tiger-setup verify on the Setup.exe it built.

TigerSetup installs for the current user by default and adds tiger-setup to
that user's PATH; the PATH entry is optional. Installing for all users asks for
administrator approval. Uninstalling removes everything the installation added,
except a file you changed after installing it.

tiger-setup build contacts the WinGet community catalog only to resolve WinGet
dependencies a package declares (tiger-setup build --offline makes no network
request). The installers it builds download a prerequisite the package
declares, from the WinGet catalog or from the address the package names, only
when the computer lacks it. Reading product metadata from an MSBuild project
needs the .NET SDK. TigerSetup sends no telemetry.

The installers it builds are transactional: an install or upgrade completes or
rolls back, and each installation records what it owns, so upgrade, uninstall
and verification work from what is really installed."""
