# TigerSetup packages itself: the self-hosted installer of the two release
# binaries (`tiger-setup.exe`, the builder, and `tigersetup-setup.exe`, the
# engine), built by the current TigerSetup release engine on the normal
# release-quality path (`TigerSetup-Design.md` §8.4). Build-Package.ps1 stages
# the release binaries into stage/ and runs `tiger-setup build` on this file;
# stage/ is ignored by Git.
#
# The product being installed is TigerSetup, so the generated Setup.exe's own
# Windows VERSIONINFO and icon identify TigerSetup — which is exactly what a
# generated installer is meant to do for any product.

[package]
id = "ItTiger.TigerSetup"              # stable identity: ARP key, WinGet id
name = "TigerSetup"
publisher = "IT Tiger"
license = "MIT"
license_file = "../../LICENSE.txt"     # shown by the wizard's licence page
icon = "../../docs/assets/TigerSetup.ico"   # the product's branding icon
description = "A small, native Windows setup builder: it turns a declarative TigerSetup.toml into a self-contained Setup.exe with SQLite-backed transactional installation state."
website = "https://www.ittiger.net/"
# support and help are omitted: the only public TigerSetup destination is the
# publisher's site above, and the source repository is not one an end user can
# reach (TigerSetup-Design.md §8.4).

[metadata]
source = "exe"                         # version, copyright and company from the packaged builder's VERSIONINFO
executable = "stage/tiger-setup.exe"

[install]
scopes = ["user", "machine"]           # per-user by default (no elevation for a developer tool), machine-wide on request
architecture = "x64"
# existing_scope defaults to preserve: a rerun updates the installation that
# is there rather than adding a second one in the other scope.

[[files]]
source = "stage/**"                    # exactly the two release binaries the release ships

[[options]]
name = "path"
kind = "path"
default = true                         # the point of installing a command-line tool

[[path]]
entry = "."                            # the install root holds tiger-setup.exe and tigersetup-setup.exe
option = "path"

[registration]
display_icon = "tiger-setup.exe"

[winget]
moniker = "tigersetup"
commands = ["tiger-setup"]
tags = ["installer", "setup", "packaging", "windows"]
publisher_url = "https://www.ittiger.net/"
# package_url and publisher_support_url are omitted for the same reason as
# support and help above.
short_description = "A small, native Windows setup builder."
description = """
TigerSetup builds small, self-contained Windows Setup.exe installers from a
declarative TigerSetup.toml, with SQLite-backed transactional installation
state so that upgrade, uninstall, verification and crash recovery all plan from
what is actually installed. The package installs the builder and its engine."""
