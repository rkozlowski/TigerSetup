# TigerSetupTestApp 1.1.0 — the second version of the synthetic package: most
# files unchanged from 1.0.0, a few changed, a few removed, a few added, and
# the `Version` registry value carrying the new version, so an upgrade has a
# value to replace. The payload is generated by ../New-TestAppPayload.ps1 and
# is not committed.

[package]
id = "IT-Tiger.TigerSetupTestApp"
name = "TigerSetupTestApp"
version = "1.1.0"
publisher = "IT Tiger"

[install]
scopes = ["user", "machine"]

[[files]]
source = "payload/**"

[[options]]
name = "path"
kind = "path"
default = true

[[options]]
name = "desktop-shortcut"
kind = "desktop-shortcut"
default = false

[[shortcuts]]
location = "start-menu"
target = "bin/TigerSetupTestApp.exe"
description = "The synthetic test application"

[[shortcuts]]
location = "desktop"
target = "bin/TigerSetupTestApp.exe"
option = "desktop-shortcut"

[[path]]
entry = "bin"
option = "path"

[[registry]]
key = "IT Tiger\\TigerSetupTestApp"
name = "InstallRoot"
kind = "expand-string"
data = "%INSTALLROOT%"

[[registry]]
key = "IT Tiger\\TigerSetupTestApp"
name = "Version"
kind = "string"
data = "%VERSION%"

[registration]
display_icon = "bin/TigerSetupTestApp.exe"
