# TigerSetupTestApp 1.0.0 — the synthetic package that proves the transactional
# engine: files, installer options, shortcuts, a PATH entry, product registry
# values and an Add/Remove Programs registration. The payload is generated by
# ../New-TestAppPayload.ps1 and is not committed.

[package]
id = "IT-Tiger.TigerSetupTestApp"
name = "TigerSetupTestApp"
version = "1.0.0"
publisher = "IT Tiger"

[install]
scopes = ["user", "machine"]
# user_root defaults to %LOCALAPPDATA%\Programs\TigerSetupTestApp and
# machine_root to %PROGRAMFILES%\TigerSetupTestApp

[[files]]
source = "payload/**"

[[options]]
name = "path"
kind = "path"
default = true

[[options]]
name = "desktop-shortcut"
kind = "desktop-shortcut"
default = false

[[shortcuts]]
location = "start-menu"
target = "bin/TigerSetupTestApp.exe"
description = "The synthetic test application"

[[shortcuts]]
location = "desktop"
target = "bin/TigerSetupTestApp.exe"
option = "desktop-shortcut"

[[path]]
entry = "bin"
option = "path"

[[registry]]
key = "IT Tiger\\TigerSetupTestApp"
name = "InstallRoot"
kind = "expand-string"
data = "%INSTALLROOT%"

[[registry]]
key = "IT Tiger\\TigerSetupTestApp"
name = "Version"
kind = "string"
data = "%VERSION%"

[registration]
display_icon = "bin/TigerSetupTestApp.exe"
