[package]
name = "tigersetup-catalog"
description = "The WinGet community catalog client shared by the TigerSetup builder and engine: WinHTTP downloads, the pre-indexed source, version data and merged manifests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tigersetup-format = { workspace = true }
rusqlite = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
yaml-rust2 = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Networking_WinHttp"] }

[dev-dependencies]
tempfile = { workspace = true }
