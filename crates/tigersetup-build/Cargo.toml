[package]
name = "tigersetup-build"
description = "The TigerSetup builder: TigerSetup.toml model, file-set resolution, runtime metadata, composition; the tiger-setup CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tiger-setup"
path = "src/bin/tiger-setup.rs"

[dependencies]
tigersetup-format = { workspace = true }
tigersetup-catalog = { workspace = true }
# Builds `tigersetup-loader.exe` beside `tiger-setup.exe`, where the
# builder reads it from; the library itself is empty.
tigersetup-loader = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
glob = { workspace = true }
clap = { workspace = true }
# The PE VERSIONINFO provider reads a built binary's version resource; the
# resource writer gives each generated installer its own identity and icon
# through the Win32 resource-update API, on a temporary copy of the engine.
# `tiger-setup shell` leaves Ctrl+C to the command prompt it waits for.
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_System_Console"] }
tempfile = { workspace = true }
# `inspect --output-zip` reconstructs an ordinary archive from the payload.
zip = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }

