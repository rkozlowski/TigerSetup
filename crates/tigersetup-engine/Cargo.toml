[package]
name = "tigersetup-engine"
description = "The TigerSetup installation engine: state database, journal, typed operations, transactions, recovery, dependencies, reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tigersetup-format = { workspace = true }
tigersetup-catalog = { workspace = true }
rusqlite = { workspace = true }
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
