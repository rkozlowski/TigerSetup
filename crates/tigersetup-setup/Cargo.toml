[package]
name = "tigersetup-setup"
description = "The common TigerSetup installer engine, with its command-line client and wizard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tigersetup-setup"
path = "src/main.rs"

# The client reaches the format only through the engine's re-export. The
# loader every generated Setup.exe begins with is `tigersetup-loader`'s C
# executable: the dependency builds it beside the engine, and its build
# script tells this package's where it is, for the process-level tests
# that build real installers.
[dependencies]
tigersetup-engine = { workspace = true }
tigersetup-loader = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# The wizard draws itself: common controls, GDI text, the shell's folder
# picker and stock icons, the per-monitor DPI calls, the clipboard the
# completion page copies the log path to, and the console the GUI-subsystem
# executable attaches to for machine-readable output.
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
# The dependency tests read the recorded dependency events out of state.db.
rusqlite = { workspace = true }
tigersetup-build = { workspace = true }
tigersetup-format = { workspace = true }
tempfile = { workspace = true }
