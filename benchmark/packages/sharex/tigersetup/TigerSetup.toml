# ShareX 21.0.0 benchmark package. Functional contract: ../contract.md.
# Payload is the canonical ShareX payload (benchmark/canonical/ShareX/payload,
# regenerated by scripts/New-CanonicalPayload.ps1), referenced relative to
# this manifest so the package never embeds a developer-machine path.

[package]
id = "Benchmark.ShareX"
name = "ShareX"
version = "21.0.0"
publisher = "ShareX Team (repackaged for the TigerSetup benchmark)"

[install]
scopes = ["user", "machine"]

[[files]]
source = "../../../canonical/ShareX/payload/**"

[[options]]
name = "desktop-shortcut"
kind = "desktop-shortcut"
default = false
label = { "en-US" = "Create a desktop shortcut" }

[[options]]
name = "send-to"
default = false
label = { "en-US" = "Add a Send To entry" }

[[options]]
name = "context-menu"
default = false
label = { "en-US" = "Add \"Upload with ShareX\" to the Explorer context menu" }

[[options]]
name = "startup"
default = false
label = { "en-US" = "Start ShareX at sign-in" }

[[shortcuts]]
location = "start-menu"
target = "ShareX.exe"
description = "ShareX"

[[shortcuts]]
location = "desktop"
target = "ShareX.exe"
option = "desktop-shortcut"

[[shortcuts]]
location = "send-to"
target = "ShareX.exe"
when = { option = "send-to", equals = true }

[[shortcuts]]
location = "startup"
name = "ShareX"
target = "ShareX.exe"
arguments = "-silent"
when = { option = "startup", equals = true }

[[context_menu]]
target = "files"
verb = "UploadWithShareX"
label = "Upload with ShareX"
executable = "ShareX.exe"
arguments = "-workflow \"%1\""
when = { option = "context-menu", equals = true }
