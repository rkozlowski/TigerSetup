# The compression-architecture spike tool. A separate Cargo workspace on
# purpose: none of these codecs is a TigerSetup product dependency, and the
# product workspace must not see them (benchmark/compression-spike/README.md).
[package]
name = "cspike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The product's own DEFLATE encoder and backend (workspace Cargo.toml), so the
# baseline is the bytes tiger-setup writes today.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.14", features = ["experimental"] }
zstd-sys = "2.1"
liblzma = { version = "0.4", features = ["static"] }
liblzma-sys = "0.4"
sha2 = "0.10"
crc32fast = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
